name: Capture real UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start application
        run: npm run dev -- --host 127.0.0.1 > /tmp/ui.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:5173 --timeout 120000
      - name: Capture desktop and mobile UI
        run: |
          mkdir -p docs/screenshots
          npx playwright screenshot --wait-for-timeout 5000 --full-page --viewport-size "1440,1000" http://127.0.0.1:5173 docs/screenshots/ui-desktop.png
          npx playwright screenshot --wait-for-timeout 5000 --full-page --device "iPhone 13" http://127.0.0.1:5173 docs/screenshots/ui-mobile.png
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: add real application UI screenshots"
          git push
